reference_grid:
  mask_regions:
    crs: "EPSG:6933"
    transform: [1000.0, 0.0, 2260000.0, 0.0, -1000.0, 1558000.0]
    shape: [1125, 1204]
    bounds: [2260000.0, 433000.0, 3464000.0, 1558000.0]

runtime:
  target_product: "viirs"
  study_start_date: "2002-07-01"
  tamsat:
    sm_version: "2.3.1"
  lake_levels:
    albert_bbox: [30.5, 1.5, 31.5, 2.5]
    albert_collection: "HYDROWEB_LAKES_OPE"
    albert_zip_path: "data/downloads/lake_levels/albert.zip"
    temp_extraction_dir: "data/downloads/lake_levels/temp_extraction"
    albert_target_paths:
      - "HYDROWEB_LAKES_OPE/hydroprd_L_albert.txt"
      - "HYDROWEB_LAKES_OPE/HYDROWEB_LAKES_OPE/hydroprd_L_albert.txt"
  teleconnections:
    min_date: "2002-07-01"

ablation:
  enabled: true
  pipeline:
    target_column: "percent_inundation_ssd"
    drop_metadata_columns: true
    forecast_horizon_periods: "auto_two_months"
    forecast_horizon_months: 2
    metrics:
      extreme_event_top_fraction: 0.10
    feature_selection:
      enabled: true
      near_constant_variance_threshold: 1.0e-8
      high_correlation_threshold: 0.995
      cv_splits: 5
      candidate_feature_counts: [8, 16, 32, 64, 128]
      include_all_features_candidate: true
      elastic_net:
        alpha: 0.001
        l1_ratio: 0.5
        max_iter: 10000
      cache:
        enabled: true
    pca:
      enabled: false
      n_components: 0.95
      whiten: false
      seed: 42
    optional_feature_blocks:
      calendar: true
      include_target_lag_features: true
      include_feature_lag_features: true
      lag_steps: [1, 2, 3, 6, 12]
  experiments:
    models: ["random_forest"]
    training_cutoff_dates: ["2018-07-21", "2019-07-21", "2020-07-21", "2021-07-21", "2022-07-21", "2023-07-21", "2024-07-21", "2025-07-21"]
    autoregressive_values: [false]
    target_types: ["seasonally_differenced"]
    inundation_products: ["viirs"]
    seed: 42
    log_path: "model/ablation/ablation_experiment_log.csv"
  artifacts:
    base_dir: "model/ablation/artifacts"

